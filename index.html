// 🖐️ Robust Finger Counter (Fixed Thumb detection)
function countFingers(lm) {
  let count = 0;
  // 4 Main Fingers (Index, Middle, Ring, Pinky)
  if (lm[8].y < lm[6].y) count++;
  if (lm[12].y < lm[10].y) count++;
  if (lm[16].y < lm[14].y) count++;
  if (lm[20].y < lm[18].y) count++;

  // Thumb Finger (Distance/Vector-based to support left/right/facing direction)
  const thumbTip = lm[4];
  const thumbBase = lm[2];
  const pinkyBase = lm[17];
  const distThumbToPinky = Math.hypot(thumbTip.x - pinkyBase.x, thumbTip.y - pinkyBase.y);
  const distBaseToPinky = Math.hypot(thumbBase.x - pinkyBase.x, thumbBase.y - pinkyBase.y);
  
  if (distThumbToPinky > distBaseToPinky * 1.2) {
    count++;
  }
  return count;
}

function createHandAI(cfg) {
  let camera = null;
  let hands = null;
  let active = false;
  let closed = false;
  let lastFire = 0;

  function onResults(results) {
    const cv = $(cfg.canvasId);
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!(results.multiHandLandmarks && results.multiHandLandmarks.length)) return;
    const lm = results.multiHandLandmarks[0];
    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#34d399', lineWidth: 2 });
    drawLandmarks(ctx, lm, { color: '#ff5a5f', lineWidth: 1, radius: 2 });
    const dist = Math.hypot(lm[8].x - lm[0].x, lm[8].y - lm[0].y);
    const g = $(cfg.gestureId);
    
    // Gesture Cooldown Check
    const now = performance.now();
    if (dist < 0.25) {
      closed = true;
      g.textContent = t('aiFist');
    } else if (closed && dist >= 0.35) {
      closed = false;
      g.textContent = t('aiOpen');
      if (now - lastFire > 1200) {
        lastFire = now;
        cfg.onThrow();
      }
    } else {
      const n = countFingers(lm);
      if (n > 0) {
        g.textContent = t('aiFingers', { n: n });
        cfg.onFingers(n);
      }
    }
  }

  async function start() {
    if (typeof Hands === 'undefined' || typeof Camera === 'undefined') { toast(t('aiNoLib'), 'bad'); return; }
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast(t('aiInsecure'), 'bad');
      cfg.onState(false);
      return;
    }
    try {
      const probe = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      probe.getTracks().forEach(tr => tr.stop());
    } catch (err) {
      let inFrame = false;
      try { inFrame = window.self !== window.top; } catch (e2) { inFrame = true; }
      const key = ((err.name === 'NotAllowedError' || err.name === 'SecurityError') && inFrame) ? 'aiIframe'
        : (err.name === 'NotAllowedError' || err.name === 'SecurityError') ? 'aiDenied'
        : err.name === 'NotFoundError' ? 'aiNoCam'
        : err.name === 'NotReadableError' ? 'aiBusy' : 'aiError';
      toast(t(key), 'bad');
      cfg.onState(false);
      return;
    }
    try {
      const video = $(cfg.videoId);
      hands = new Hands({ locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f });
      hands.setOptions({ maxNumHands: 1, modelComplexity: cfg.complexity, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
      hands.onResults(onResults);
      camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: cfg.width, height: cfg.height, facingMode: 'user'
      });
      await camera.start();
      active = true;
      cfg.onState(true);
    } catch (e) {
      active = false;
      cfg.onState(false);
      toast(t('aiError'), 'bad');
    }
  }

  function stop() {
    if (camera) { try { camera.stop(); } catch (e) {} }
    if (hands) { try { hands.close(); } catch (e) {} }
    const video = $(cfg.videoId);
    if (video.srcObject) { video.srcObject.getTracks().forEach(tr => tr.stop()); video.srcObject = null; }
    const cv = $(cfg.canvasId);
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    camera = null;
    hands = null;
    active = false;
    closed = false;
    $(cfg.gestureId).textContent = '';
    cfg.onState(false);
  }

  return {
    toggle() { if (active) stop(); else start(); },
    refresh() { cfg.onState(active); }
  };
}

let mainAI = null;
let mobileAI = null;

function setupMainAI() {
  mainAI = createHandAI({
    videoId: 'webcamVideo', canvasId: 'webcamCanvas', gestureId: 'aiGestureText', complexity: 1, width: 320, height: 240,
    onThrow: () => tossDice(),
    onFingers: n => {
      const sel = $('predictSelect');
      const idx = state.count === 1 ? n - 1 : n;
      sel.selectedIndex = clamp(idx, 0, sel.options.length - 1);
      sel.dispatchEvent(new Event('change'));
    },
    onState: a => {
      $('btnToggleCamera').textContent = t(a ? 'aiCloseBtn' : 'aiOpenBtn');
      const b = $('aiBadge');
      b.textContent = t(a ? 'aiOnBadge' : 'aiOffBadge');
      b.classList.toggle('active', a);
    }
  });
  mainAI.refresh();
}

function setupMobileAI() {
  mobileAI = createHandAI({
    videoId: 'mobileWebcamVideo', canvasId: 'mobileWebcamCanvas', gestureId: 'mobileAiGestureText', complexity: 0, width: 240, height: 180,
    onThrow: () => playMobileRound(false),
    onFingers: n => {
      const sel = $('mobileGuess');
      const idx = parseInt($('mobileDiceCount').value, 10) === 1 ? n - 1 : n;
      sel.selectedIndex = clamp(idx, 0, sel.options.length - 1);
    },
    onState: a => { $('btnToggleMobileCamera').textContent = t(a ? 'mobAiBtnOff' : 'mobAiBtn'); }
  });
  mobileAI.refresh();
}

function readPlayers() {
  try {
    const arr = JSON.parse(store.get('kahoot_live_players', '[]'));
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

let boardJson = '';
let boardFirst = true;
const knownPlayers = new Set();

function renderRealtimeScoreboard(list, force) {
  const arr = Array.isArray(list) ? list.slice() : [];
  const json = JSON.stringify(arr) + lang;
  if (!force && json === boardJson) return;
  boardJson = json;
  const initial = boardFirst;
  boardFirst = false;
  const tb = $('qrScoreboardBody');
  if (!arr.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty">' + esc(t('noPlayers')) + '</td></tr>';
    knownPlayers.clear();
    return;
  }
  arr.sort((a, b) => b.points - a.points);
  let html = '';
  let popped = false;
  arr.forEach((p, i) => {
    const name = String(p.name);
    const fresh = !knownPlayers.has(name);
    if (fresh) { knownPlayers.add(name); if (!initial) popped = true; }
    const badge = i === 0 ? '👑 ' : (i === 1 ? '🥈 ' : (i === 2 ? '🥉 ' : ''));
    const rankCls = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : ''));
    const rowCls = (fresh && !initial) ? 'player-row kahoot-enter' : 'player-row ' + rankCls;
    const status = p.isDefeated ? '<span class="st-bad">' + esc(t('stDefeated')) + '</span>' : '<span class="st-ok">' + esc(t('stActive')) + '</span>';
    html += '<tr class="' + rowCls + '"><td>' + badge + esc(t('rankFmt', { n: i + 1 })) + '</td><td class="nm">👤 ' + esc(name) +
      '</td><td class="pt">' + esc(t('ptsFmt', { n: p.points })) + '</td><td>' + esc(t('roundsFmt', { n: p.roundsPlayed })) + '</td><td>' + status + '</td></tr>';
  });
  tb.innerHTML = html;
  if (popped) playPop();
}

function listenRealtimeUpdates() {
  renderRealtimeScoreboard(readPlayers(), true);
  if (CHANNEL) {
    CHANNEL.onmessage = ev => {
      if (ev.data && ev.data.type === 'UPDATE_PLAYERS') renderRealtimeScoreboard(ev.data.players);
    };
  }
  window.addEventListener('storage', e => {
    if (e.key === 'kahoot_live_players') renderRealtimeScoreboard(readPlayers());
  });
  setInterval(() => renderRealtimeScoreboard(readPlayers()), 700);
}

function clearAllPlayers() {
  const pass = prompt(t('adminPrompt'));
  if (pass === null) return;
  if (pass !== ADMIN_PASSWORD) { toast(t('adminWrong'), 'bad'); return; }
  if (!confirm(t('adminConfirm'))) return;
  store.remove('kahoot_live_players');
  knownPlayers.clear();
  if (CHANNEL) CHANNEL.postMessage({ type: 'UPDATE_PLAYERS', players: [] });
  renderRealtimeScoreboard([], true);
  toast(t('adminDone'), 'ok');
}

function playUrl() {
  try {
    const u = new URL(window.location.href);
    u.hash = '';
    u.search = '';
    u.searchParams.set('mode', 'play');
    return u.toString();
  } catch (e) {
    return window.location.href.split('#')[0].split('?')[0] + '?mode=play';
  }
}

function initQRCode() {
  const box = $('qrcode');
  box.innerHTML = '';
  const url = playUrl();
  $('qrUrl').textContent = url;
  if (window.location.protocol === 'file:') $('qrWarn').style.display = 'block';
  if (typeof QRCode !== 'undefined') {
    new QRCode(box, { text: url, width: 168, height: 168, colorDark: '#0b1230', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
  } else {
    box.style.display = 'none';
  }
}

function copyQrUrl() {
  const url = playUrl();
  const done = () => toast(t('qrCopied'), 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}

const mobile = { name: '', points: 10, roundsPlayed: 0, isDefeated: false, rolling: false, stage: null };
let mobileTimer = null;
let timeLeft = 30;

function buildMobileDiceOptions() {
  const sel = $('mobileDiceCount');
  const prev = sel.value || '3';
  let html = '';
  for (let n = 1; n <= 5; n++) html += '<option value="' + n + '">' + esc(t('mobDiceOpt', { n: n, a: n, b: n * 6 })) + '</option>';
  sel.innerHTML = html;
  sel.value = prev;
}

function updateMobileGuessOptions() {
  const n = parseInt($('mobileDiceCount').value, 10);
  const prev = parseInt($('mobileGuess').value, 10);
  let html = '';
  for (let i = n; i <= n * 6; i++) {
    html += '<option value="' + i + '">' + esc(n === 1 ? t('predictFace', { n: i }) : t('predictOpt', { n: i })) + '</option>';
  }
  $('mobileGuess').innerHTML = html;
  if (!isNaN(prev) && prev >= n && prev <= n * 6) $('mobileGuess').value = String(prev);
}

function setupMobileDiceView() {
  const n = parseInt($('mobileDiceCount').value, 10);
  mobile.stage.setCount(n);
  updateMobileGuessOptions();
}

function startMobilePlayer() {
  const name = $('mobilePlayerName').value.trim();
  if (!name) return toast(t('mobNeedName'), 'warn');
  mobile.name = name;
  mobile.points = 10;
  mobile.roundsPlayed = 0;
  mobile.isDefeated = false;
  $('mobileRegCard').style.display = 'none';
  $('mobilePlayCard').style.display = 'block';
  $('mobileWelcome').textContent = t('mobPlayer', { n: mobile.name });
  if (!mobile.stage) mobile.stage = createStage($('mobileStage'), { compact: true });
  setupMobileDiceView();
  broadcastPlayerUpdate();
  startRoundTimer();
}

function startRoundTimer() {
  clearInterval(mobileTimer);
  timeLeft = 30;
  $('timerSec').textContent = timeLeft;
  mobileTimer = setInterval(() => {
    timeLeft--;
    $('timerSec').textContent = Math.max(0, timeLeft);
    if (timeLeft <= 0) {
      clearInterval(mobileTimer);
      toast(t('mobTimeout'), 'warn');
      playMobileRound(true);
    }
  }, 1000);
}

async function playMobileRound(isAuto) {
  if (!mobile.stage || $('mobilePlayCard').style.display === 'none') return;
  if (mobile.isDefeated || mobile.points <= 0) return toast(t('mobDefeatedToast'), 'bad');
  if (mobile.roundsPlayed >= 10) return toast(t('mobMaxToast'), 'warn');
  if (mobile.rolling) return;
  mobile.rolling = true;
  clearInterval(mobileTimer);
  const btn = $('btnRollDiceMobile');
  btn.disabled = true;
  $('mobileDiceCount').disabled = true;

  let bet = parseInt($('mobileBetAmount').value, 10);
  if (isNaN(bet) || bet < 1) bet = 1;
  if (bet > mobile.points) bet = mobile.points;
  $('mobileBetAmount').value = bet;

  const n = parseInt($('mobileDiceCount').value, 10);
  let guess = parseInt($('mobileGuess').value, 10);
  if (isAuto || isNaN(guess)) guess = n + Math.floor(Math.random() * (n * 6 - n + 1));

  playDiceSound();
  const results = randomResults(n);
  const res = await mobile.stage.roll(results);
  mobile.rolling = false;
  $('mobileDiceCount').disabled = false;
  if (!res) { btn.disabled = false; startRoundTimer(); return; }

  const sum = results.reduce((a, b) => a + b, 0);
  mobile.roundsPlayed++;
  const log = $('mobileResultLog');
  if (guess === sum) {
    playWin();
    const win = bet * 3;
    mobile.points += win;
    log.style.color = '#34495e';
    log.textContent = t('mobWin', { s: sum, w: win });
  } else {
    mobile.points -= bet;
    log.style.color = '#fb7185';
    log.textContent = t('mobLose', { s: sum, b: bet });
  }

  if (mobile.points <= 0) {
    mobile.points = 0;
    mobile.isDefeated = true;
    btn.disabled = true;
    $('timerBox').style.display = 'none';
    log.innerHTML += '<br><span style="color:#fb7185;font-size:1.15em">' + esc(t('mobDefeated')) + '</span>';
  } else if (mobile.roundsPlayed >= 10) {
    btn.disabled = true;
    $('timerBox').style.display = 'none';
    log.innerHTML += '<br><span style="color:#fbbf24">' + esc(t('mobFinished', { p: mobile.points })) + '</span>';
  } else {
    btn.disabled = false;
    startRoundTimer();
  }

  $('mobilePoints').textContent = mobile.points;
  $('mobileRounds').textContent = mobile.roundsPlayed;
  broadcastPlayerUpdate();
}

function broadcastPlayerUpdate() {
  const list = readPlayers();
  const rec = { name: mobile.name, points: mobile.points, roundsPlayed: mobile.roundsPlayed, isDefeated: mobile.isDefeated };
  const idx = list.findIndex(p => p.name === mobile.name);
  if (idx >= 0) list[idx] = rec; else list.push(rec);
  store.set('kahoot_live_players', JSON.stringify(list));
  if (CHANNEL) CHANNEL.postMessage({ type: 'UPDATE_PLAYERS', players: list });
}

function switchTab(name) {
  qsa('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  qsa('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  const body = document.querySelector('.tab-body');
  if (body) body.scrollTop = 0;
  if (name === 'lab' && probChart) setTimeout(() => probChart.resize(), 50);
}

function setLanguage(l) {
  if (!I18N[l]) return;
  lang = l;
  store.set('pb_lang', l);
  applyI18n();
  if (IS_PLAY) {
    buildMobileDiceOptions();
    updateMobileGuessOptions();
    if (mobile.name) $('mobileWelcome').textContent = t('mobPlayer', { n: mobile.name });
    if (mobileAI) mobileAI.refresh();
    return;
  }
  updatePredictionOptions(true);
  updateTossLabel();
  updateUI();
  renderQuiz();
  refreshHotspotTags();
  refreshCard();
  if (mainAI) mainAI.refresh();
  renderRealtimeScoreboard(readPlayers(), true);
}

// 🌐 Bind Language buttons for both Desktop & Mobile synchronously
function bindCommon() {
  ['btnTH', 'btnTH2'].forEach(id => {
    if ($(id)) $(id).addEventListener('click', () => setLanguage('th'));
  });
  ['btnEN', 'btnEN2'].forEach(id => {
    if ($(id)) $(id).addEventListener('click', () => setLanguage('en'));
  });
  $('btnSound').addEventListener('click', toggleSound);
  $('btnSound').textContent = soundOn ? '🔊' : '🔇';
  initAudioResumer();
}

function initMain() {
  initChart();
  loadQuizData();
  stage = createStage($('stage3d'), {
    onDieClick: i => { showCard({ id: 'die', i: i, v: stage.dice[i].val }); }
  });
  buildHotspots();

  qsa('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  qsa('[data-go]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.go)));
  $('modeStepBtn').addEventListener('click', () => setSimMode('step'));
  $('modeFastBtn').addEventListener('click', () => setSimMode('fast'));
  $('itemSlider').addEventListener('input', setupExperiment);
  $('trialSlider').addEventListener('input', runFastSimulation);
  $('tossBtn').addEventListener('click', tossDice);
  $('resetBtn').addEventListener('click', resetStats);
  $('predictSelect').addEventListener('change', () => { updateUI(); refreshCard(); });
  $('btnViewReset').addEventListener('click', () => stage.resetView());
  $('btnViewTop').addEventListener('click', () => stage.topView());
  $('btnAutoRotate').addEventListener('click', () => {
    const on = !stage.controls.autoRotate;
    stage.setAutoRotate(on);
    $('btnAutoRotate').classList.toggle('active', on);
  });
  $('btnExport').addEventListener('click', exportCSV);
  $('btnQuizSubmit').addEventListener('click', checkQuizAnswers);
  $('btnQuizReset').addEventListener('click', resetDefaultQuestions);
  $('btnAddQuiz').addEventListener('click', addNewQuiz);
  $('btnClearPlayers').addEventListener('click', clearAllPlayers);
  $('btnCopyQr').addEventListener('click', copyQrUrl);
  $('btnToggleCamera').addEventListener('click', () => mainAI.toggle());

  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
    e.preventDefault();
    tossDice();
  });
  setupMainAI();
  updateTossLabel();
  setupExperiment();
  initQRCode();
  listenRealtimeUpdates();
}

function initPlay() {
  $('mainApp').style.display = 'none';
  $('mobileGamePanel').style.display = 'block';
  buildMobileDiceOptions();
  $('mobileDiceCount').value = '3';
  updateMobileGuessOptions();
  $('mobileDiceCount').addEventListener('change', setupMobileDiceView);
  $('btnMobileStart').addEventListener('click', startMobilePlayer);
  $('btnRollDiceMobile').addEventListener('click', () => playMobileRound(false));
  $('btnToggleMobileCamera').addEventListener('click', () => mobileAI.toggle());
  setupMobileAI();
}

document.addEventListener('DOMContentLoaded', () => {
  applyI18n();
  bindCommon();
  if (IS_PLAY) initPlay(); else initMain();
});
</script>
